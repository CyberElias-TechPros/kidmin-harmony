# Cloudflare Workers configuration for the KidMin Harmony API.
#
# Before deploying:
#   1. `npx wrangler login`
#   2. `npx wrangler d1 create kidmin-harmony-db`  -> copy the database_id below
#   3. `npx wrangler r2 bucket create kidmin-harmony-media`
#   4. `npx wrangler secret put JWT_SECRET`  -> set a long random string
#   5. `npm run db:migrate:remote`
#   6. `npm run deploy`

name = "kidmin-harmony"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Bind the D1 SQLite database.
[[d1_databases]]
binding = "DB"
database_name = "kidmin-harmony-db"
database_id = "3f22a119-f2e8-4205-bab6-fc806fe9463d"
migrations_dir = "migrations"

# Bind the R2 bucket for file / image uploads.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kidmin-harmony-media"

[observability]
enabled = true

# NOTE (seeding): the demo-seed endpoint is NOT enabled by default. For local
# development, put `SEED_DEMO=true` in `.dev.vars` (see .dev.vars.example).
# In production the variable simply does not exist, so /api/auth/seed always
# returns 403. Optionally also set the IANA timezone used for "today"
# (attendance, event status), e.g. APP_TIMEZONE = "Africa/Lagos".
